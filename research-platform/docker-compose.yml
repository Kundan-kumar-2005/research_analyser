services:

  app:
    build: .
    ports:
      - "8090:8080"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: research_platform
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      FILE_UPLOAD_DIR: /uploads

    networks:
      - s-network

    depends_on:
      - mysql

    volumes:
      - ./uploads:/uploads


  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: research_platform

    ports:
      - "3307:3306"

    networks:
      - s-network

    volumes:
      - mysql-data:/var/lib/mysql


networks:
  s-network:
    driver: bridge


volumes:
  mysql-data: